<div class="bg-gray-50 dark:bg-gray-900/50 border border-gray-100 dark:border-gray-800/80 rounded-2xl p-5 shadow-sm hover:shadow-md dark:hover:border-gray-700 transition-all duration-300 flex flex-col justify-between">
  <div>

    <!-- Encabezado de la tarjeta -->
    <div class="flex justify-between items-center mb-4 border-b border-gray-200 dark:border-gray-800 pb-2">
      <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100">{{ nombre() }}</h2>
      <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-400 border dark:border-blue-900/40">
        {{ tipo() }}
      </span>
    </div>

    <!-- Rejilla de métricas internas -->
    <div class="grid grid-cols-2 gap-3">

      <div class="bg-white dark:bg-gray-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800/60 shadow-sm">
        <p class="text-xs text-gray-400 dark:text-gray-500 font-medium uppercase">MCC</p>
        <p class="text-base font-bold text-gray-800 dark:text-gray-200">{{ mcc() }}</p>
      </div>

      <div class="bg-white dark:bg-gray-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800/60 shadow-sm">
        <p class="text-xs text-gray-400 dark:text-gray-500 font-medium uppercase">Accuracy</p>
        <p class="text-base font-bold text-gray-800 dark:text-gray-200">{{ accuracy() }}</p>
      </div>

      <div class="bg-white dark:bg-gray-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800/60 shadow-sm">
        <p class="text-xs text-gray-400 dark:text-gray-500 font-medium uppercase">AUC</p>
        <p class="text-base font-bold text-gray-800 dark:text-gray-200">{{ auc() }}</p>
      </div>

      <div class="bg-white dark:bg-gray-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800/60 shadow-sm">
        <p class="text-xs text-gray-400 dark:text-gray-500 font-medium uppercase">F1-Score</p>
        <p class="text-base font-bold text-gray-800 dark:text-gray-200">{{ f1() }}</p>
      </div>

      <!-- Fila de pérdida (Loss) condicional/completa -->
      <div class="bg-white dark:bg-gray-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800/60 shadow-sm col-span-2 flex justify-between items-center">
        <p class="text-xs text-gray-400 dark:text-gray-500 font-medium uppercase">Loss</p>
        <p class="text-sm font-bold text-red-500 dark:text-red-400 truncate pl-4 max-w-[180px] sm:max-w-none" [title]="loss() || '-'">
          {{ loss() || '-' }}
        </p>
      </div>

    </div>
  </div>
</div>
