<form autocomplete="off" [formGroup]="myForm" class="flex flex-col md:flex-row gap-6 items-center justify-center w-full">

  <div class="flex-1 w-full max-w-md">
    <div
      class="upload-area border-3 border-dashed border-blue-400 dark:border-gray-700 rounded-2xl p-8 bg-blue-50/30 dark:bg-gray-900/30 hover:border-blue-500 dark:hover:border-indigo-500 hover:bg-blue-50 dark:hover:bg-indigo-950/20 transition-all duration-300 cursor-pointer text-center group hover:-translate-y-1"
      (click)="fileInput.click()"
    >
      <div class="text-5xl mb-4 group-hover:scale-110 transition-transform duration-300">
        📸
      </div>
      <div class="text-lg font-bold text-gray-700 dark:text-gray-200 mb-1">
        {{ 'PREDICCION.FORMULARIO.CARGAR' | translate }}
      </div>
      <div class="text-xs text-gray-400 dark:text-gray-500">
        {{ 'PREDICCION.FORMULARIO.CLICK' | translate }}
      </div>
    </div>
    <input
      #fileInput
      type="file"
      id="fileInput"
      accept="image/*"
      (change)="onFileSelected($event)"
      style="display: none"
    />
  </div>

  @if (myForm.value.imagen && imagePreviewUrl) {
    <div class="flex-1 w-full max-w-xs flex flex-col items-center justify-center animate-fade-in">
      <div class="relative bg-white dark:bg-gray-900 p-2 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-md mb-4">
        <img
          [src]="imagePreviewUrl"
          class="w-[224px] h-[224px] object-cover rounded-xl shadow-inner"
          alt="Vista previa histopatológica"
        />
      </div>
      <button
        type="button"
        class="analyze-btn w-full bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 dark:from-red-600 dark:dark:to-red-700 text-white font-bold py-3.5 px-6 rounded-full text-base transition-all duration-300 hover:-translate-y-1 hover:shadow-xl shadow-red-500/20 cursor-pointer active:scale-95"
        (click)="analyzeImage()"
      >
        {{ 'PREDICCION.FORMULARIO.ANALIZAR' | translate }}
      </button>
    </div>
  }
</form>
