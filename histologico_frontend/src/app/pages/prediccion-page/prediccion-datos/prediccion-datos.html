@if (prediccionService.prediccion(); as resultados) {

  <div class="mt-6 space-y-6 max-w-7xl mx-auto">
    <!-- SECCIÓN 1: Modelos individuales -->
    <div class="space-y-4">
      <div class="text-center p-3 bg-gray-50 border border-gray-200 rounded-xl">
        <h3 class="text-xl md:text-2xl font-extrabold text-gray-800 text-center">
          {{ 'INDIVIDUAL_MODELS_TITLE' | translate }}
        </h3>
        <p class="text-gray-700 text-center text-lg md:text-xl">
          {{ 'INDIVIDUAL_MODELS_SUBTITLE' | translate }}
        </p>
      </div>

      <!-- PREDICCIONES INDIVIDUALES -->
      <app-prediccion-datos-modelos [resultados]="resultados.resultados_individuales" [imagen]="resultados.imagen_procesada_modelo" [original]="prediccionService.urlImagen"/>

    </div>

    <!-- SEPARADOR VISUAL -->
    <div class="flex items-center my-8">
      <div class="flex-grow border-t border-gray-300"></div>
      <div class="mx-4 text-gray-800 text-xl md:text-2xl font-extrabold">
        {{ 'FINAL_VERDICT_SEPARATOR' | translate }}
      </div>
      <div class="flex-grow border-t border-gray-300"></div>
    </div>

    <!-- SECCIÓN 2: Resultado definitivo XGBoost -->
    <app-prediccion-datos-definitivo [xgboost]="resultados.XGBoost_ensamble" />

    <!-- SEPARADOR VISUAL -->
    <div class="flex items-center my-8">
      <div class="flex-grow border-t border-gray-300"></div>
      <div class="mx-4 text-gray-800 text-xl md:text-2xl font-extrabold">IA EXPLICATIVA POR MODELO</div>
      <div class="flex-grow border-t border-gray-300"></div>
    </div>

    <app-prediccion-datos-explicativa
      [cait]="resultados.resultados_individuales['CaiT'].mapa_calor"
      [deit]="resultados.resultados_individuales['DeiT'].mapa_calor"
      [densenet]="resultados.resultados_individuales['DenseNet'].mapa_calor"
      [efficientnet]="resultados.resultados_individuales['EfficientNet'].mapa_calor"

      [inception]="resultados.resultados_individuales['Inception'].mapa_calor"
      [pvt]="resultados.resultados_individuales['PVT'].mapa_calor"
      [swin]="resultados.resultados_individuales['Swin'].mapa_calor"
      [vit]="resultados.resultados_individuales['ViT'].mapa_calor"
    />

  </div>

}
