<div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-100 flex items-center justify-center p-8">
  <div
    class="bg-white/95 backdrop-blur-sm rounded-3xl p-8 shadow-2xl w-full border border-white/30"
  >

    @if (carga() === 1) {
      <div class="absolute inset-0 bg-white/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-all duration-300">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-purple-200 border-t-purple-600 mb-4"></div>
        <p class="text-purple-800 font-semibold text-lg animate-pulse">
          Loading...
        </p>
      </div>
    }

    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 text-center"> {{ 'PREDICCION.TITULO' | translate }} </h1>
      <p class="text-gray-700 text-center text-lg md:text-xl"> {{ 'PREDICCION.SUBTITULO' | translate }} </p>
    </div>
    <prediccion-formulario (onCargar)="cargando()" />
    <prediccion-datos (onCargado)="cargado()" />
  </div>
</div>
