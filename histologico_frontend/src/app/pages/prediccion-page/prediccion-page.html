<div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-100 dark:from-gray-950 dark:via-slate-900 dark:to-gray-950 flex items-center justify-center p-4 md:p-8 transition-colors duration-300">
  <div class="bg-white/95 dark:bg-gray-900/90 backdrop-blur-sm rounded-3xl p-6 md:p-8 shadow-2xl w-full border border-white/30 dark:border-gray-800/50 relative overflow-hidden">

    @if (carga() === 1) {
      <div class="absolute inset-0 bg-white/70 dark:bg-gray-950/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-all duration-300">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-purple-200 dark:border-purple-900 border-t-purple-600 dark:border-t-purple-400 mb-4"></div>
        <p class="text-purple-800 dark:text-purple-400 font-semibold text-lg animate-pulse">
          Loading...
        </p>
      </div>
    }

    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 dark:text-gray-100 tracking-tight">
        {{ 'PREDICCION.TITULO' | translate }}
      </h1>
      <p class="text-gray-600 dark:text-gray-400 text-base md:text-lg mt-2 max-w-2xl mx-auto">
        {{ 'PREDICCION.SUBTITULO' | translate }}
      </p>
    </div>

    <prediccion-formulario (onCargar)="cargando()" />
    <prediccion-datos (onCargado)="cargado()" />

  </div>
</div>
