<div class="px-4 py-4 mt-auto border-t border-gray-200 dark:border-gray-800/80 transition-colors duration-300 relative">

  <!-- Fila de Botones principales -->
  <div class="flex gap-2 w-full">

    <!-- Botón Conmutador de Tema -->
    <button
      (click)="themeService.toggleTheme()"
      [class.bg-sky-950]="!themeService.darkMode()"
      [class.text-amber-400]="!themeService.darkMode()"
      [class.border-sky-900]="!themeService.darkMode()"
      [class.bg-black]="themeService.darkMode()"
      [class.text-yellow-400]="themeService.darkMode()"
      [class.border-gray-900]="themeService.darkMode()"
      class="px-3 py-2.5 rounded-xl border transition-all duration-300 flex items-center justify-center min-w-[46px] active:scale-95 shadow-sm cursor-pointer"
      [title]="themeService.darkMode() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'"
    >
      <div
        class="transition-transform duration-500 ease-out flex items-center justify-center"
        [class.rotate-[360deg]]="themeService.darkMode()"
      >
        @if (themeService.darkMode()) {
          <span class="text-base select-none">🌙</span>
        } @else {
          <span class="text-base select-none">☀️</span>
        }
      </div>
    </button>

    <!-- Botón Desplegable de Idioma Activo -->
    <button
      (click)="isOpen = !isOpen"
      [class.bg-sky-950]="!themeService.darkMode()"
      [class.border-sky-900]="!themeService.darkMode()"
      [class.text-sky-200]="!themeService.darkMode()"
      [class.bg-black]="themeService.darkMode()"
      [class.border-gray-900]="themeService.darkMode()"
      [class.text-slate-300]="themeService.darkMode()"
      class="flex-1 px-3 py-2.5 rounded-xl border transition-all flex items-center justify-between group cursor-pointer shadow-md"
    >
      <div class="flex items-center gap-2">
        <span class="text-base leading-none">{{ getCurrentFlag() }}</span>
        <span
          [class.text-sky-100]="!themeService.darkMode()"
          [class.text-slate-200]="themeService.darkMode()"
          class="text-xs font-bold tracking-wide group-hover:text-white"
        >
          {{ getCurrentLanguageName() }}
        </span>
      </div>
      <svg
        [class.rotate-180]="isOpen"
        [class.text-sky-400]="!themeService.darkMode()"
        [class.text-slate-500]="themeService.darkMode()"
        class="w-3.5 h-3.5 transition-transform duration-200 text-sky-400 group-hover:text-sky-200"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
      </svg>
    </button>
  </div>

  <!-- Panel Flotante de Selección de Idiomas (Hacia abajo) -->
  @if (isOpen) {
    <div
      [class.bg-sky-950]="!themeService.darkMode()"
      [class.border-sky-900]="!themeService.darkMode()"
      [class.bg-black]="themeService.darkMode()"
      [class.border-gray-900]="themeService.darkMode()"
      class="absolute top-full left-4 right-4 mt-1 space-y-1 max-h-56 overflow-y-auto border rounded-xl p-1.5 shadow-2xl backdrop-blur-md animate-fadeIn"
      style="z-index: 9999 !important;"
    >
      @for (lang of languages; track lang.code) {
        <button
          (click)="changeLanguage(lang.code); isOpen = false"

          [class.bg-sky-600]="currentLanguage === lang.code && !themeService.darkMode()"
          [class.bg-gray-900]="currentLanguage === lang.code && themeService.darkMode()"
          [class.text-white]="currentLanguage === lang.code"

          [class.text-sky-100]="currentLanguage !== lang.code && !themeService.darkMode()"
          [class.text-slate-300]="currentLanguage !== lang.code && themeService.darkMode()"

          [class.hover:bg-white/10]="currentLanguage !== lang.code"

          class="w-full px-3 py-2.5 rounded-lg transition-all flex items-center gap-2.5 cursor-pointer text-left font-semibold"
        >
          <span class="text-base leading-none">{{ lang.flag }}</span>
          <span class="text-xs font-bold tracking-wide">{{ lang.name }}</span>

          @if (currentLanguage === lang.code) {
            <svg class="w-4 h-4 ml-auto text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          }
        </button>
      }
    </div>
  }

</div>
