<!-- Botón abrir/cerrar -->

<button
  (click)="toggleMenu()"
  [class.left-[276px]]="isOpen()"
  [class.left-4]="!isOpen()"
  class="fixed top-4 z-50 p-2.5 rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-700 dark:text-slate-300 shadow-md hover:bg-gray-50 dark:hover:bg-gray-800 transition-all duration-300 ease-in-out active:scale-95 cursor-pointer"
>
  @if (!isOpen()) {
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  } @else {
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  }
</button>

<!-- Overlay -->

@if (isOpen() && isMobileView()) {
  <div
    (click)="closeMenu()"
    class="fixed inset-0 z-40 bg-black/40 backdrop-blur-xs transition-opacity duration-300"
  ></div>
}

<!-- Sidebar -->

<div
  id="menu"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  class="fixed left-0 top-0 z-45 h-screen w-[260px] bg-gray-900 dark:bg-black text-slate-300 border-r border-gray-800 overflow-y-auto flex flex-col shadow-xl transition-transform duration-300 ease-in-out"
>
  <div class="flex flex-col w-[260px] h-full p-4 pt-20 space-y-6">

    <app-side-menu-header />

    <app-side-menu-language />

    <app-side-menu-options />

  </div>
</div>
