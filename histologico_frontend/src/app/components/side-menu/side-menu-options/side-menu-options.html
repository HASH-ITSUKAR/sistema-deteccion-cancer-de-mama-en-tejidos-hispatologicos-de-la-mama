<div id="nav" class="w-full px-3 space-y-1.5 flex-1">
  @for (item of menuOptions; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-sky-950 dark:bg-black text-sky-400 dark:text-blue-400 border-l-4 border-blue-600 dark:border-blue-500 font-bold shadow-xs"
      [routerLinkActiveOptions]="{ exact: true }"
      class="w-full px-4 py-3.5 inline-flex space-x-3.5 items-center rounded-xl text-gray-600 dark:text-slate-300 hover:bg-sky-950 dark:hover:bg-black hover:text-sky-100 dark:hover:text-white transition-all duration-150 group border-l-4 border-transparent"
    >
      <div class="text-xl w-6 h-6 flex items-center justify-center text-gray-400 group-hover:text-sky-300 dark:group-hover:text-blue-400 transition-colors">
        <app-icon [icon]="item.icon" />
      </div>

      <div class="flex flex-col min-w-0 flex-1">
        <span class="text-base font-extrabold tracking-wide transition-colors">
          {{ item.label | translate }}
        </span>
        <span class="text-xs text-gray-400 dark:text-slate-500 truncate mt-0.5 group-hover:text-sky-200/80 dark:group-hover:text-slate-400">
          {{ item.subLabel | translate }}
        </span>
      </div>
    </a>
  }
</div>
